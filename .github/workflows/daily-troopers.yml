name: Daily Mini Troopers Automation

on:
  schedule:
    # 1) Daily Battles: 22:05 UTC (00:05 EET / 01:05 EEST)
    - cron: '5 22 * * *'
    # 2) Auto-Upgrade: 00:30 UTC (02:30 EET / 03:30 EEST)
    - cron: '30 0 * * *'
    # 3) Auto-Configure Soldier AI: 02:00 UTC (04:00 EET / 05:00 EEST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Which task to run manually?'
        required: true
        default: 'battles'
        type: choice
        options:
          - battles
          - upgrade-dry-run
          - upgrade-live
          - auto-config

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Restore secret.cfg from GitHub Secret (Base64)
        env:
          SECRET_CFG_B64: ${{ secrets.SECRET_CFG_B64 }}
        run: |
          if [ -z "$SECRET_CFG_B64" ]; then
            echo "ERROR: SECRET_CFG_B64 is empty! Add it in Repo Settings -> Secrets -> Actions."
            exit 1
          fi
          printf '%s' "$SECRET_CFG_B64" | base64 -d > backend/scripts/secret.cfg
          sed -i 's/\r$//' backend/scripts/secret.cfg
          chmod 600 backend/scripts/secret.cfg

      - name: Run Daily Battles, Missions & Raids
        if: github.event.schedule == '5 22 * * *' || github.event.inputs.task == 'battles'
        working-directory: ./backend/scripts
        run: |
          chmod +x troopers.sh run_accounts.sh
          ./run_accounts.sh

      - name: Run Auto-Upgrade (Dry Run)
        if: github.event.inputs.task == 'upgrade-dry-run'
        working-directory: ./backend
        run: node scripts/autoUpgrade.js --dry-run

      - name: Run Auto-Upgrade (Live)
        if: github.event.schedule == '30 0 * * *' || github.event.inputs.task == 'upgrade-live'
        working-directory: ./backend
        run: node scripts/autoUpgrade.js

      - name: Run Auto-Configure Soldier AI
        if: github.event.schedule == '0 2 * * *' || github.event.inputs.task == 'auto-config'
        working-directory: ./backend
        run: |
          chmod +x scripts/troopers.sh scripts/run_accounts.sh
          (cd scripts && ./troopers.sh --scrape-only)
          node scripts/autoConfigCli.js